# DETACHED workspace. bdk_wallet 3.x has a newer MSRV than the root core
# workspace, so Signet/regtest practice-wallet code lives here with its own
# toolchain and lockfile.
[workspace]

[package]
name = "signet-lab"
description = "Disposable regtest and Signet practice wallets for recovery drills."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/__GH_ORG__/bitcoin-lifeboat"
authors = ["Bitcoin Lifeboat Contributors"]

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
bdk_wallet = "=3.0.0"
error-taxonomy = { path = "../error-taxonomy" }
rand = "0.8"
serde_json = "1"
zeroize = "1.8"
