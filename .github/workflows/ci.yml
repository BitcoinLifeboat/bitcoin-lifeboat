name: CI

on:
  push:
    branches: [main, ralph/bitcoin-lifeboat]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: never

jobs:
  matrix:
    name: ${{ matrix.os }} on ${{ matrix.runner }} / Rust ${{ matrix.rust }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13, windows-latest, ubuntu-22.04, ubuntu-24.04]
        rust: [stable, 1.78.0]
        node: [20.x, 22.x]
        include:
          - os: macos-14
            runner: macos-14
          # GitHub retired the hosted macos-13 label after the PRD 25.6 matrix
          # was written. Keep the historical axis, but run it on the supported
          # Intel successor so the CI remains executable.
          - os: macos-13
            runner: macos-15-intel
          - os: windows-latest
            runner: windows-latest
          - os: ubuntu-22.04
            runner: ubuntu-22.04
          - os: ubuntu-24.04
            runner: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt

      - name: Configure deterministic Rust paths
        shell: bash
        run: |
          printf 'RUSTFLAGS=--remap-path-prefix=%s=. --remap-path-prefix=%s=~\n' "$GITHUB_WORKSPACE" "$HOME" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Show tool versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Rust build
        run: cargo build --workspace --all-targets --locked

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests and insta snapshots
        run: cargo test --workspace --all-targets --locked

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Desktop typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Desktop vitest
        working-directory: apps/desktop
        run: npm test

      - name: Desktop security guardrails
        working-directory: apps/desktop
        run: npm run verify:security

      - name: Desktop build
        working-directory: apps/desktop
        run: npm run build

  rust-coverage:
    name: Rust coverage (core crates >= 80%)
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.78.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview

      - name: Configure deterministic Rust paths
        shell: bash
        run: |
          printf 'RUSTFLAGS=--remap-path-prefix=%s=. --remap-path-prefix=%s=~\n' "$GITHUB_WORKSPACE" "$HOME" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate Rust coverage
        run: cargo llvm-cov --workspace --all-targets --locked --json --output-path target/llvm-cov.json

      - name: Enforce per-crate coverage
        run: python3 scripts/check-rust-coverage.py target/llvm-cov.json 80

  hardware-wallet-emulators:
    name: Hardware wallet emulator smoke (${{ matrix.device }})
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.78.0
    strategy:
      fail-fast: false
      matrix:
        device: [trezor, coldcard, bitbox02, jade]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Run hardware-wallet emulator smoke
        shell: bash
        run: bash scripts/hardware-wallet-emulator-smoke.sh "${{ matrix.device }}"

  desktop-native-linux:
    name: Native Tauri wrapper (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.86.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config
          scripts/check-native-desktop-deps.sh

      - name: Install HWI sidecar
        shell: bash
        run: scripts/install-hwi-sidecar.sh --target x86_64-unknown-linux-gnu

      - name: Test Tauri wrapper
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
