name: Docs

on:
  push:
    branches: [main, ralph/bitcoin-lifeboat]
    paths:
      - "apps/docs-site/**"
      - "docs/**"
      - "project.config.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs-site/**"
      - "docs/**"
      - "project.config.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          path: apps/docs-site
          node-version: 22

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
