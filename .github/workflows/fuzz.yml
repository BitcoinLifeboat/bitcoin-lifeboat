name: Fuzz

on:
  push:
    branches: [main, ralph/bitcoin-lifeboat]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_MAX_TOTAL_TIME: ${{ startsWith(github.ref, 'refs/tags/v') && '3600' || '300' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_detector_arbitrary
          - fuzz_detector_false_positive
          - fuzz_detector_false_negative
          - fuzz_descriptor_with_xprv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install nightly Rust
        shell: bash
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build fuzz target
        working-directory: fuzz
        run: cargo +nightly fuzz build ${{ matrix.target }}

      - name: Run fuzz target
        working-directory: fuzz
        shell: bash
        run: |
          timeout "$((FUZZ_MAX_TOTAL_TIME + 120))s" \
            cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$FUZZ_MAX_TOTAL_TIME"
