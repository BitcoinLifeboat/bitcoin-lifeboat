name: Security

on:
  push:
    branches: [main, ralph/bitcoin-lifeboat]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.78.0

jobs:
  rust-supply-chain:
    name: Rust advisories, licenses, sources, and bans
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo audit (deny Medium+ advisories)
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0009

      - name: cargo deny advisories, licenses, sources, and bans
        run: cargo deny --locked check advisories licenses sources bans

  npm-audit:
    name: npm audit (${{ matrix.app }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: desktop
            path: apps/desktop
          - app: docs-site
            path: apps/docs-site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: npm audit (deny High/Critical)
        working-directory: ${{ matrix.path }}
        run: npm audit --audit-level=high

  osv:
    name: OSV lockfile scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # OSV reports every known vulnerability and has no severity threshold knob.
      # cargo-audit and npm audit enforce the PRD failure thresholds; OSV stays
      # visible without failing this workflow on existing moderate-only findings.
      fail-on-vuln: false
      scan-args: |-
        --config=./osv-scanner.toml
        --lockfile=./Cargo.lock
        --lockfile=./apps/desktop/package-lock.json
        --lockfile=./apps/docs-site/package-lock.json

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep CE scan
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Semgrep
        shell: bash
        run: |
          if [[ -f semgrep-rules/rust-bitcoin.yml ]]; then
            semgrep scan --error --config semgrep-rules/rust-bitcoin.yml
          else
            semgrep scan --config auto
          fi
