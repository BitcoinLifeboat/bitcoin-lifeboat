version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Root Rust stays pinned to 1.78. These dependencies are intentionally
      # capped to avoid newer MSRVs, edition-2024 manifests, or snapshot churn.
      - dependency-name: bitcoin
      - dependency-name: miniscript
      - dependency-name: crc
      - dependency-name: home
      - dependency-name: image
      - dependency-name: base64
      - dependency-name: sha2
      - dependency-name: fluent-bundle
      - dependency-name: unic-langid
      - dependency-name: clap_complete
      - dependency-name: clap_mangen
      - dependency-name: clap_complete_nushell
      - dependency-name: insta
      - dependency-name: criterion
      - dependency-name: clap_builder
      - dependency-name: half
      - dependency-name: printpdf
      - dependency-name: time
      - dependency-name: thiserror

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The detached Tauri lockfile pulls the root path crates. Keep the same
      # MSRV and deterministic-output pins from the root workspace intact here.
      - dependency-name: bitcoin
      - dependency-name: miniscript
      - dependency-name: crc
      - dependency-name: home
      - dependency-name: image
      - dependency-name: fluent-bundle
      - dependency-name: unic-langid
      - dependency-name: clap_complete
      - dependency-name: clap_mangen
      - dependency-name: clap_complete_nushell
      - dependency-name: insta
      - dependency-name: criterion
      - dependency-name: clap_builder
      - dependency-name: half
      - dependency-name: printpdf
      - dependency-name: time
      - dependency-name: base64
      - dependency-name: sha2
      - dependency-name: rand

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/docs-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
